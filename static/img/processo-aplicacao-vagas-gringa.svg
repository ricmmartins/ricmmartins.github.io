<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a3a5c">Processo de aplicação para vagas na gringa</text>

  <!-- Phase 1: Preparação (ongoing) -->
  <rect x="20" y="50" width="640" height="100" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="340" y="72" text-anchor="middle" font-weight="bold" font-size="12" fill="#1a3a5c">⚙️ FASE 1 — Preparação contínua (meses antes)</text>

  <rect x="40" y="82" width="140" height="55" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="110" y="103" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">GitHub</text>
  <text x="110" y="118" text-anchor="middle" font-size="9" fill="#555">2-3 projetos com</text>
  <text x="110" y="130" text-anchor="middle" font-size="9" fill="#555">CI/CD + README + IaC</text>

  <rect x="200" y="82" width="140" height="55" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="270" y="103" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">Blog técnico</text>
  <text x="270" y="118" text-anchor="middle" font-size="9" fill="#555">5-10 posts mostrando</text>
  <text x="270" y="130" text-anchor="middle" font-size="9" fill="#555">resolução de problemas</text>

  <rect x="360" y="82" width="140" height="55" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="430" y="103" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">Networking</text>
  <text x="430" y="118" text-anchor="middle" font-size="9" fill="#555">Comunidades, OSS</text>
  <text x="430" y="130" text-anchor="middle" font-size="9" fill="#555">conferências, ajudar</text>

  <rect x="520" y="82" width="125" height="55" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="582" y="103" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">LinkedIn</text>
  <text x="582" y="118" text-anchor="middle" font-size="9" fill="#555">Headline + Summary</text>
  <text x="582" y="130" text-anchor="middle" font-size="9" fill="#555">em inglês, atividade</text>

  <!-- Arrow down -->
  <line x1="340" y1="150" x2="340" y2="175" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 2: Regra de 1 hora -->
  <rect x="20" y="180" width="640" height="140" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="340" y="202" text-anchor="middle" font-weight="bold" font-size="12" fill="#1b5e20">🕐 FASE 2 — Regra de 1 hora (por aplicação)</text>

  <rect x="40" y="215" width="145" height="90" rx="6" fill="#f8f9fa" stroke="#888" stroke-width="1.5"/>
  <text x="112" y="235" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">15min</text>
  <text x="112" y="252" text-anchor="middle" font-size="10" fill="#555">Pesquisar empresa</text>
  <text x="112" y="267" text-anchor="middle" font-size="9" fill="#555">Produto, stack, negócio</text>
  <text x="112" y="282" text-anchor="middle" font-size="9" fill="#555">Testar, encontrar bugs</text>

  <line x1="185" y1="260" x2="205" y2="260" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="210" y="215" width="145" height="90" rx="6" fill="#f8f9fa" stroke="#888" stroke-width="1.5"/>
  <text x="282" y="235" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">15min</text>
  <text x="282" y="252" text-anchor="middle" font-size="10" fill="#555">Customizar currículo</text>
  <text x="282" y="267" text-anchor="middle" font-size="9" fill="#555">Reordenar bullets</text>
  <text x="282" y="282" text-anchor="middle" font-size="9" fill="#555">Ajustar keywords</text>

  <line x1="355" y1="260" x2="375" y2="260" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="380" y="215" width="145" height="90" rx="6" fill="#f8f9fa" stroke="#888" stroke-width="1.5"/>
  <text x="452" y="235" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">15min</text>
  <text x="452" y="252" text-anchor="middle" font-size="10" fill="#555">Cover letter</text>
  <text x="452" y="267" text-anchor="middle" font-size="9" fill="#555">Hook + Conexão</text>
  <text x="452" y="282" text-anchor="middle" font-size="9" fill="#555">Evidência + Dispo.</text>

  <line x1="525" y1="260" x2="545" y2="260" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="550" y="215" width="95" height="90" rx="6" fill="#f8f9fa" stroke="#888" stroke-width="1.5"/>
  <text x="597" y="235" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">15min</text>
  <text x="597" y="252" text-anchor="middle" font-size="10" fill="#555">Testar</text>
  <text x="597" y="267" text-anchor="middle" font-size="9" fill="#555">produto ou ler</text>
  <text x="597" y="282" text-anchor="middle" font-size="9" fill="#555">eng. blog</text>

  <!-- Arrow down -->
  <line x1="340" y1="320" x2="340" y2="345" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 3: Result comparison -->
  <rect x="20" y="350" width="310" height="150" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="175" y="375" text-anchor="middle" font-weight="bold" font-size="12" fill="#7a2020">❌ Abordagem em massa</text>
  <text x="175" y="398" text-anchor="middle" font-size="11" fill="#333">100 aplicações genéricas/mês</text>
  <text x="175" y="418" text-anchor="middle" font-size="11" fill="#333">~0 respostas</text>
  <text x="175" y="438" text-anchor="middle" font-size="11" fill="#333">Cover letter copiada</text>
  <text x="175" y="458" text-anchor="middle" font-size="11" fill="#333">Currículo igual pra tudo</text>
  <text x="175" y="485" text-anchor="middle" font-size="10" fill="#7a2020" font-weight="bold">Taxa de sucesso: ~0%</text>

  <text x="340" y="425" text-anchor="middle" font-size="16" fill="#666" font-weight="bold">vs</text>

  <rect x="350" y="350" width="310" height="150" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="505" y="375" text-anchor="middle" font-weight="bold" font-size="12" fill="#1b5e20">✅ Abordagem focada</text>
  <text x="505" y="398" text-anchor="middle" font-size="11" fill="#333">5 aplicações/semana</text>
  <text x="505" y="418" text-anchor="middle" font-size="11" fill="#333">~30% taxa de resposta</text>
  <text x="505" y="438" text-anchor="middle" font-size="11" fill="#333">Cover letter específica</text>
  <text x="505" y="458" text-anchor="middle" font-size="11" fill="#333">Pesquisa profunda por empresa</text>
  <text x="505" y="485" text-anchor="middle" font-size="10" fill="#1b5e20" font-weight="bold">Encontra o "total fit"</text>
</svg>
