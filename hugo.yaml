baseURL: "https://ricardomartins.com.br/"
title: "Ricardo Martins — Cloud Architecture, Azure, Kubernetes e DevOps"
paginate: 10
theme: PaperMod
locale: pt-BR
defaultContentLanguage: pt

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

taxonomies:
  tag: tags
  category: categories

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

related:
  includeNewer: true
  threshold: 80
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 80
    - name: date
      weight: 10

params:
  env: production
  title: "Ricardo Martins"
  description: "Blog sobre Cloud, Azure, AI e DevOps por Ricardo Martins, Principal Solutions Engineer na Microsoft. Tutoriais, guias e boas práticas."
  keywords: [Cloud, Azure, Kubernetes, DevOps, Linux, Docker, AKS, Cloud Architecture, Blog]
  author: "Ricardo Martins"
  images: ["/images/profile.png"]
  DateFormat: "2 de January de 2006"
  defaultTheme: auto
  disableThemeToggle: false

  schema:
    publisherType: "Person"
    sameAs:
      - "https://linkedin.com/in/ricmmartins"
      - "https://github.com/ricmmartins"
      - "https://x.com/ricmmartins"
      - "https://rmmartins.com"

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"

  label:
    text: "Ricardo Martins"

  profileMode:
    enabled: true
    title: "Olá, eu sou o Ricardo! 👋"
    subtitle: |
      Estude. Crie. Documente.

      Principal Solutions Engineer @ Microsoft.
      Escrevendo sobre Azure, AI e infraestrutura desde 2005.
      Faça coisas, escreva sobre isso. Crescemos quando compartilhamos!
    imageUrl: "/images/profile.png"
    imageTitle: "Ricardo Martins"
    imageWidth: 150
    imageHeight: 150
    buttons:
      - name: "📝 Posts"
        url: "/posts/"
      - name: "🚀 Projetos"
        url: "/projetos/"
      - name: "👤 Sobre"
        url: "/sobre/"

  socialIcons:
    - name: linkedin
      url: "https://linkedin.com/in/ricmmartins"
    - name: github
      url: "https://github.com/ricmmartins"
    - name: x
      url: "https://x.com/ricmmartins"
    - name: instagram
      url: "https://www.instagram.com/ricardommartins"
    - name: link
      title: "Publicações"
      url: "https://github.com/ricmmartins/activitylog"
    - name: globe
      title: "Blog em Inglês"
      url: "https://rmmartins.com"
    - name: rss
      url: "/feed.xml"

  analytics:
    google:
      SiteVerificationTag: "google89f7d5476a280bca"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  editPost:
    URL: "https://github.com/ricmmartins/ricmmartins.github.io/tree/main/content"
    Text: "Sugerir alteração"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

services:
  googleAnalytics:
    id: "G-SZKPK13326"
  disqus:
    shortname: "rmmartins"

menu:
  main:
    - identifier: posts
      name: "Posts"
      url: /posts/
      weight: 10
    - identifier: projects
      name: "Projetos"
      url: /projetos/
      weight: 20
    - identifier: tags
      name: "Tags"
      url: /tags/
      weight: 30
    - identifier: archives
      name: "Arquivo"
      url: /arquivo/
      weight: 40
    - identifier: search
      name: "Busca"
      url: /busca/
      weight: 50
    - identifier: about
      name: "Sobre"
      url: /sobre/
      weight: 60

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai

permalinks:
  posts: "/:slug/"
